<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archwood School Lekki | World-Class Nursery & Primary Education</title>
    <style id="anti-netlify-overlay">
      iframe[src*="netlify"],
      iframe[title*="Netlify"],
      [data-netlify-badge],
      netlify-feedback-drawer,
      #netlify-drawer-root,
      div[class*="netlify"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        max-width: 0 !important;
        max-height: 0 !important;
        overflow: hidden !important;
        pointer-events: none !important;
        position: absolute !important;
        top: -9999px !important;
        left: -9999px !important;
      }
    </style>
    <meta name="description" content="Archwood School Lekki provides an excellent world class nursery and primary education using well trained, highly motivated professionals to impact the gift of knowledge in Ikota Villa, Lekki, Lagos." />
    <meta property="og:title" content="Archwood School Lekki | Impact The Gift Of Knowledge" />
    <meta property="og:description" content="Nursery and primary education in Ikota Villa, Lekki Country Homes Road, Lagos. 2026/2027 Admissions Open." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Forcefully remove Netlify toolbar and feedback drawer elements
      const removeNetlifyBadge = () => {
        const selectors = [
          'netlify-feedback-drawer',
          '#netlify-drawer-root',
          '[data-netlify-badge]',
          'iframe[src*="netlify"]',
          'div[class*="netlify-drawer"]'
        ];
        
        selectors.forEach(selector => {
          document.querySelectorAll(selector).forEach(el => el.remove());
        });

        // Handle Shadow DOM injections if present
        document.querySelectorAll('*').forEach(el => {
          if (el.shadowRoot) {
            selectors.forEach(selector => {
              el.shadowRoot.querySelectorAll(selector).forEach(node => node.remove());
            });
          }
        });
      };

      // Run on DOM content loaded and periodically for the first 5 seconds
      window.addEventListener('DOMContentLoaded', removeNetlifyBadge);
      const interval = setInterval(removeNetlifyBadge, 300);
      setTimeout(() => clearInterval(interval), 5000);
    </script>
  </head>
  <body class="bg-neutral-50 text-neutral-900 antialiased selection:bg-purple-900 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
